- hosts: k8s_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute configure-kubelet.sh
      shell: "sudo {{ ki_env_scripts_path }}/k8s-node/configure-kubelet.sh {{ vars_path_arg }}"
      when: target_node is not defined or inventory_hostname == target_node
